<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IndexQL Playground</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/material.min.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f10;
        min-height: 100vh;
        padding: 16px;
        color: #e4e4e7;
      }

      .app-header {
        max-width: 1600px;
        margin: 0 auto 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .app-header h1 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #fafafa;
      }

      .app-header h1 span {
        color: #a78bfa;
      }

      .app-header .badge {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 2px 8px;
        border-radius: 9999px;
        background: rgba(167, 139, 250, 0.15);
        color: #a78bfa;
        border: 1px solid rgba(167, 139, 250, 0.25);
      }

      .container {
        max-width: 1600px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        height: calc(100vh - 80px);
      }

      .panel {
        background: #18181b;
        border-radius: 12px;
        border: 1px solid #27272a;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .header {
        padding: 12px 16px;
        border-bottom: 1px solid #27272a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-shrink: 0;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .header-dot.green { background: #22c55e; }
      .header-dot.blue { background: #60a5fa; }

      .header-title {
        font-size: 13px;
        font-weight: 600;
        color: #a1a1aa;
        letter-spacing: 0.01em;
      }

      .header-actions {
        display: flex;
        gap: 6px;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 6px;
        border: 1px solid #27272a;
        background: transparent;
        color: #71717a;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.15s ease;
      }

      .icon-btn:hover {
        background: #27272a;
        color: #e4e4e7;
        border-color: #3f3f46;
      }

      .icon-btn.danger:hover {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        border-color: rgba(239, 68, 68, 0.3);
      }

      .code-editor {
        flex: 1;
        overflow: hidden;
      }

      .CodeMirror {
        height: 100% !important;
        font-family: "Geist Mono", "Fira Code", "JetBrains Mono", "Cascadia Code", monospace !important;
        font-size: 13px !important;
        line-height: 1.6 !important;
        background: #18181b !important;
      }

      .CodeMirror-gutters {
        background: #18181b !important;
        border-right: 1px solid #27272a !important;
      }

      .CodeMirror-linenumber {
        color: #3f3f46 !important;
      }

      .controls {
        padding: 10px 16px;
        border-top: 1px solid #27272a;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
      }

      .controls select {
        padding: 7px 10px;
        border: 1px solid #27272a;
        border-radius: 6px;
        font-size: 12px;
        font-family: "Inter", sans-serif;
        cursor: pointer;
        background: #09090b;
        color: #a1a1aa;
        min-width: 0;
        flex: 1;
      }

      .controls select:hover {
        border-color: #3f3f46;
        color: #e4e4e7;
      }

      .btn {
        padding: 7px 14px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        font-family: "Inter", sans-serif;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.15s ease;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .btn-primary {
        background: #a78bfa;
        color: #09090b;
        border-color: #a78bfa;
      }

      .btn-primary:hover {
        background: #8b5cf6;
        border-color: #8b5cf6;
      }

      .btn-primary:disabled {
        background: #3f3f46;
        color: #71717a;
        border-color: #3f3f46;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: transparent;
        color: #a1a1aa;
        border-color: #27272a;
      }

      .btn-secondary:hover {
        background: #27272a;
        color: #e4e4e7;
        border-color: #3f3f46;
      }

      .btn-ghost {
        background: transparent;
        color: #71717a;
        border: none;
        padding: 7px 10px;
      }

      .btn-ghost:hover {
        color: #e4e4e7;
        background: #27272a;
      }

      .output-section {
        display: flex;
        flex-direction: column;
        flex: 1;
        overflow: hidden;
      }

      .output {
        flex: 1;
        overflow: auto;
        padding: 12px 16px;
      }

      .output::-webkit-scrollbar {
        width: 6px;
      }

      .output::-webkit-scrollbar-track {
        background: transparent;
      }

      .output::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 3px;
      }

      .output-item {
        margin-bottom: 10px;
        padding: 12px 14px;
        border-radius: 8px;
        font-family: "Geist Mono", "Fira Code", monospace;
        font-size: 12px;
        line-height: 1.5;
        border: 1px solid;
      }

      .output-item.error {
        border-color: rgba(239, 68, 68, 0.25);
        background: rgba(239, 68, 68, 0.06);
        color: #fca5a5;
      }

      .output-item.success {
        border-color: rgba(34, 197, 94, 0.2);
        background: rgba(34, 197, 94, 0.04);
        color: #d4d4d8;
      }

      .output-item .query-label {
        display: block;
        font-size: 11px;
        color: #71717a;
        margin-bottom: 6px;
        padding-bottom: 6px;
        border-bottom: 1px solid #27272a;
        font-weight: 500;
      }

      .output-item pre {
        margin: 0;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .output-item.collapsible .output-content {
        position: relative;
      }

      .output-item.collapsible.collapsed .output-content {
        max-height: 200px;
        overflow: hidden;
      }

      .output-item.collapsible.collapsed .output-content::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 60px;
        background: linear-gradient(to bottom, transparent, rgba(34, 197, 94, 0.04));
        pointer-events: none;
      }

      .output-item.collapsible.collapsed.error .output-content::after {
        background: linear-gradient(to bottom, transparent, rgba(239, 68, 68, 0.06));
      }

      .collapse-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        padding: 4px 10px;
        font-size: 11px;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        color: #71717a;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid #27272a;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.15s ease;
        width: fit-content;
      }

      .collapse-toggle:hover {
        color: #a1a1aa;
        background: rgba(255, 255, 255, 0.06);
        border-color: #3f3f46;
      }

      .collapse-toggle .chevron {
        display: inline-block;
        transition: transform 0.2s ease;
        font-size: 10px;
      }

      .collapsed .collapse-toggle .chevron {
        transform: rotate(-90deg);
      }

      .collapse-toggle.top {
        margin-top: 0;
        margin-bottom: 8px;
      }

      .collapsible.collapsed .collapse-toggle.top {
        display: none;
      }

      .row-count-badge {
        font-size: 10px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 9999px;
        background: rgba(167, 139, 250, 0.12);
        color: #a78bfa;
        border: 1px solid rgba(167, 139, 250, 0.2);
        margin-left: auto;
      }

      .output-item .output-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        padding-bottom: 6px;
        border-bottom: 1px solid #27272a;
      }

      .status-bar {
        padding: 8px 16px;
        border-top: 1px solid #27272a;
        font-size: 11px;
        color: #52525b;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .status-bar .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #22c55e;
        flex-shrink: 0;
      }

      .seed-info {
        font-size: 11px;
        color: #52525b;
        padding: 6px 16px;
      }

      .kbd {
        display: inline-block;
        padding: 1px 5px;
        font-family: "Geist Mono", monospace;
        font-size: 10px;
        color: #71717a;
        background: #27272a;
        border: 1px solid #3f3f46;
        border-radius: 4px;
        line-height: 1.4;
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #3f3f46;
        font-size: 13px;
        gap: 8px;
      }

      .empty-state .icon {
        font-size: 28px;
        opacity: 0.5;
      }

      @media (max-width: 1200px) {
        .container {
          grid-template-columns: 1fr;
          height: auto;
        }

        .panel {
          height: 50vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-header">
      <h1>Index<span>QL</span></h1>
      <span class="badge">Playground</span>
    </div>

    <div class="container">
      <!-- Editor Panel -->
      <div class="panel">
        <div class="header">
          <div class="header-left">
            <div class="header-dot green"></div>
            <span class="header-title">Query Editor</span>
          </div>
          <div class="header-actions">
            <button id="clearEditorBtn" class="icon-btn danger" title="Clear editor">&#x2715;</button>
          </div>
        </div>
        <div class="code-editor">
          <textarea id="sqlInput"></textarea>
        </div>
        <div class="controls">
          <select id="sampleQueries">
            <option value="">Load example...</option>
            <option value="basic-select">Basic Select</option>
            <option value="with-where">Where Clause</option>
            <option value="with-order">Order &amp; Limit</option>
            <option value="aggregate">Aggregates</option>
            <option value="join">Joins</option>
            <option value="functions">Functions</option>
            <option value="independent">Independent Select</option>
            <option value="multi">Multi-Query</option>
          </select>
          <button id="runBtn" class="btn btn-primary">&#9654; Run <span class="kbd">Ctrl+Enter</span></button>
        </div>
      </div>

      <!-- Output Panel -->
      <div class="panel">
        <div class="header">
          <div class="header-left">
            <div class="header-dot blue"></div>
            <span class="header-title">Results</span>
          </div>
          <div class="header-actions">
            <button id="clearOutputBtn" class="icon-btn danger" title="Clear results">&#x2715;</button>
          </div>
        </div>
        <div class="output-section">
          <div class="controls" style="border-top: none; border-bottom: 1px solid #27272a;">
            <select id="dbSelect">
              <option value="users">users</option>
              <option value="products">products</option>
              <option value="posts">posts</option>
              <option value="todos">todos</option>
            </select>
            <button id="seedBtn" class="btn btn-secondary">&#127793; Seed</button>
            <button id="countBtn" class="btn btn-ghost">&#9776; Count</button>
          </div>
          <div id="seedInfo" class="seed-info"></div>
          <div id="output" class="output">
            <div class="empty-state">
              <div class="icon">&#x276F;</div>
              <div>Run a query to see results</div>
            </div>
          </div>
          <div id="status" class="status-bar"><span class="dot"></span> Ready</div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/sql/sql.min.js"></script>
    <script src="./indexql.js"></script>
    <script>
      let db = null;
      let editor = null;

      const SAMPLE_QUERIES = {
        "basic-select": "SELECT id, name FROM users LIMIT 5",
        "with-where":
          "SELECT id, name, email FROM users WHERE id >= 1 AND id <= 10",
        "with-order": "SELECT id, name FROM users ORDER BY name ASC LIMIT 5",
        aggregate:
          "SELECT title, COUNT(*) AS count FROM posts GROUP BY title LIMIT 5",
        join: "SELECT users.firstName, posts.title FROM posts JOIN users ON posts.userId = users.id LIMIT 5",
        functions:
          "SELECT name, UPPER(name) AS upper_name, LENGTH(name) AS len\nFROM products\nLIMIT 5",
        independent:
          "SELECT 1 AS one, 2 + 3 AS sum, UPPER('hello') AS greeting",
        multi:
          "SELECT * FROM users LIMIT 3\nSELECT name, price FROM products LIMIT 3",
      };

      async function initDb() {
        const schema = {
          tables: {
            users: {
              keyPath: "id",
              indexes: { email: {}, username: {} },
            },
            products: {
              keyPath: "id",
              indexes: { category: {} },
            },
            posts: {
              keyPath: "id",
              indexes: { userId: {} },
            },
            todos: {
              keyPath: "id",
              indexes: { userId: {} },
            },
          },
        };

        db = await IndexQL.open("playground", schema);
        updateStatus("Connected");
        updateSeedInfo("");
      }

      function updateStatus(msg) {
        document.getElementById("status").innerHTML = '<span class="dot"></span> ' + escapeHtml(msg);
      }

      const COLLAPSE_LINE_THRESHOLD = 12;

      function appendOutput(msg, isError = false, queryLabel = null, rowCount = null) {
        const output = document.getElementById("output");
        // Remove empty state if present
        const emptyState = output.querySelector(".empty-state");
        if (emptyState) emptyState.remove();

        const lineCount = msg.split("\n").length;
        const isLong = lineCount > COLLAPSE_LINE_THRESHOLD;

        const item = document.createElement("div");
        item.className = "output-item " + (isError ? "error" : "success");
        if (isLong) {
          item.classList.add("collapsible", "collapsed");
        }

        let html = "";

        // Header row with query label and/or row count
        if (queryLabel || (rowCount !== null && rowCount > 0)) {
          html += '<div class="output-header">';
          if (queryLabel) {
            html += '<span class="query-label" style="margin:0;padding:0;border:0;">' + escapeHtml(queryLabel) + "</span>";
          }
          if (rowCount !== null && rowCount > 0) {
            html += '<span class="row-count-badge">' + rowCount + " row" + (rowCount !== 1 ? "s" : "") + "</span>";
          }
          html += "</div>";
        }

        if (isLong) {
          html += '<button class="collapse-toggle top" onclick="toggleCollapse(this)">';
          html += '<span class="chevron">&#x25BC;</span> Collapse';
          html += '</button>';
        }

        html += '<div class="output-content"><pre>' + escapeHtml(msg) + "</pre></div>";

        if (isLong) {
          html += '<button class="collapse-toggle bottom" onclick="toggleCollapse(this)">';
          html += '<span class="chevron">&#x25BC;</span> Show all ' + lineCount + ' lines';
          html += '</button>';
        }

        item.innerHTML = html;

        output.appendChild(item);
        output.scrollTop = output.scrollHeight;
      }

      function toggleCollapse(btn) {
        const item = btn.closest(".output-item");
        const isCollapsed = item.classList.toggle("collapsed");
        const lineCount = item.querySelector("pre").textContent.split("\n").length;
        const buttons = item.querySelectorAll(".collapse-toggle");
        buttons.forEach(function(b) {
          if (isCollapsed) {
            b.innerHTML = '<span class="chevron">&#x25BC;</span> Show all ' + lineCount + ' lines';
          } else {
            b.innerHTML = '<span class="chevron">&#x25BC;</span> Collapse';
          }
        });
      }

      function clearOutput() {
        document.getElementById("output").innerHTML =
          '<div class="empty-state"><div class="icon">&#x276F;</div><div>Run a query to see results</div></div>';
      }

      function updateSeedInfo(msg) {
        document.getElementById("seedInfo").textContent = msg;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      document
        .getElementById("sampleQueries")
        .addEventListener("change", (e) => {
          if (e.target.value) {
            editor.setValue(SAMPLE_QUERIES[e.target.value]);
            e.target.value = "";
          }
        });

      document.getElementById("runBtn").addEventListener("click", async () => {
        if (!db) {
          appendOutput("Database not initialized", true);
          return;
        }

        const query = editor.getValue().trim();
        if (!query) {
          appendOutput("Please enter a query", true);
          return;
        }

        // Clear previous results
        clearOutput();

        try {
          updateStatus("Running...");

          // Use sqlMulti to handle single or multiple queries
          const results = await db.sqlMulti(query);

          if (results.length === 1) {
            // Single query — show directly
            const r = results[0];
            if (r.error) {
              appendOutput(formatError(r.error), true);
              updateStatus("Query failed");
            } else if (r.rows.length === 0) {
              appendOutput("No rows returned", false);
              updateStatus("0 rows");
            } else {
              appendOutput(JSON.stringify(r.rows, null, 2), false, null, r.rows.length);
              updateStatus(r.rows.length + " row" + (r.rows.length !== 1 ? "s" : ""));
            }
          } else {
            // Multiple queries — show each with its query label
            let totalRows = 0;
            let failed = 0;
            for (const r of results) {
              if (r.error) {
                appendOutput(formatError(r.error), true, r.query);
                failed++;
              } else if (r.rows.length === 0) {
                appendOutput("No rows returned", false, r.query);
              } else {
                appendOutput(JSON.stringify(r.rows, null, 2), false, r.query, r.rows.length);
                totalRows += r.rows.length;
              }
            }
            const parts = [];
            parts.push(results.length + " queries");
            parts.push(totalRows + " total rows");
            if (failed > 0) parts.push(failed + " failed");
            updateStatus(parts.join(" \u00b7 "));
          }
        } catch (err) {
          appendOutput(formatError(err.message), true);
          updateStatus("Failed");
        }
      });

      function formatError(msg) {
        if (msg && msg.includes("match")) {
          return "Syntax Error: " + msg + "\n\nCheck your query syntax. Examples:\n  SELECT * FROM users\n  SELECT 1 + 2 AS sum\n  SELECT UPPER('hello')";
        }
        return msg;
      }

      // Clear editor only
      document.getElementById("clearEditorBtn").addEventListener("click", () => {
        editor.setValue("");
        editor.focus();
      });

      // Clear results only
      document.getElementById("clearOutputBtn").addEventListener("click", () => {
        clearOutput();
        updateStatus("Cleared");
      });

      document.getElementById("seedBtn").addEventListener("click", async () => {
        if (!db) {
          appendOutput("Database not initialized", true);
          return;
        }

        const table = document.getElementById("dbSelect").value;
        const resourceMap = {
          users: "users",
          products: "products",
          posts: "posts",
          todos: "todos",
        };

        try {
          updateStatus("Seeding...");
          const resource = resourceMap[table];
          const seeded = await db.populateDummy({
            resources: [resource],
            [resource]: { mode: "replace", limit: 50 },
          });

          const count = seeded[resource] || 0;
          clearOutput();
          appendOutput("Seeded " + count + " rows into " + table, false);
          updateSeedInfo(
            "Last seeded: " + table + " (" + count + " rows) \u00b7 " + new Date().toLocaleTimeString(),
          );
          updateStatus("Seeded " + count + " rows");
        } catch (err) {
          appendOutput(err.message, true);
          updateStatus("Seeding failed");
        }
      });

      document
        .getElementById("countBtn")
        .addEventListener("click", async () => {
          if (!db) {
            appendOutput("Database not initialized", true);
            return;
          }

          const table = document.getElementById("dbSelect").value;
          try {
            updateStatus("Counting...");
            const result = await db.table(table).select(null).exec();
            clearOutput();
            appendOutput(result.length + " rows in " + table, false);
            updateStatus(result.length + " rows");
          } catch (err) {
            appendOutput(err.message, true);
            updateStatus("Count failed");
          }
        });

      window.addEventListener("load", () => {
        editor = CodeMirror.fromTextArea(document.getElementById("sqlInput"), {
          lineNumbers: true,
          mode: "text/x-sql",
          theme: "material",
          indentUnit: 2,
          lineWrapping: true,
          autofocus: true,
          extraKeys: {
            "Ctrl-Enter": () => {
              document.getElementById("runBtn").click();
            },
            "Cmd-Enter": () => {
              document.getElementById("runBtn").click();
            },
          },
        });

        initDb();
      });
    </script>
  </body>
</html>
